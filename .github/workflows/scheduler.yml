name: Tri-Lingual Blog Automation Engine

on:
  schedule:
    # Runs automatically every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
    
  # Enables Instant Breaking News Triggers via Webhook/API
  repository_dispatch:
    types: [breaking_news, instant_publish]
    
  # Enables manual execution button inside GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-publish-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate Multi-Lingual Blog Posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and Push New Posts to GitHub Pages
        run: |
          git config --global user.name "Auto-News-Bot"
          git config --global user.email "bot@news.local"
          git add _posts/
          git diff-index --quiet HEAD || git commit -m "Auto-published tri-lingual blog posts [skip ci]"
          git push
